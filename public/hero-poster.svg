<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- TODO: replace with real atelier photograph poster (this is a placeholder
       evoking the warm atelier: navy dusk, amber window light, bokeh). -->
  <defs>
    <radialGradient id="amber" cx="66%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#C08A3E" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#8A5A2E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10182B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mahogany" cx="16%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#6E3D25" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#10182B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#10182B" stop-opacity="0"/>
      <stop offset="72%" stop-color="#0B1120" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080D18" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#10182B"/>
  <rect width="1600" height="1000" fill="url(#amber)"/>
  <rect width="1600" height="1000" fill="url(#mahogany)"/>

  <!-- suggestion of the dress form, out of focus -->
  <g filter="url(#softer)" opacity="0.85">
    <path d="M1060 300 C1010 330 990 400 1000 460 C1008 508 1040 540 1035 590
             C1030 645 1000 680 1005 740 C1010 800 1060 830 1105 830
             C1150 830 1200 800 1205 740 C1210 680 1180 645 1175 590
             C1170 540 1202 508 1210 460 C1220 400 1200 330 1150 300
             C1120 282 1090 282 1060 300 Z"
          fill="#0C1322"/>
    <rect x="1098" y="830" width="14" height="120" fill="#0C1322"/>
  </g>

  <!-- bokeh field -->
  <g filter="url(#soft)">
    <circle cx="1330" cy="180" r="34" fill="#C08A3E" opacity="0.55"/>
    <circle cx="1445" cy="320" r="22" fill="#E8A25C" opacity="0.45"/>
    <circle cx="1240" cy="120" r="16" fill="#E9E1D0" opacity="0.40"/>
    <circle cx="1520" cy="150" r="26" fill="#FFD9A3" opacity="0.38"/>
    <circle cx="880" cy="150" r="18" fill="#C08A3E" opacity="0.30"/>
    <circle cx="740" cy="260" r="26" fill="#8A5A2E" opacity="0.30"/>
    <circle cx="330" cy="180" r="20" fill="#C08A3E" opacity="0.22"/>
    <circle cx="180" cy="340" r="30" fill="#6E3D25" opacity="0.25"/>
    <circle cx="480" cy="120" r="12" fill="#E9E1D0" opacity="0.25"/>
    <circle cx="1400" cy="520" r="30" fill="#C08A3E" opacity="0.30"/>
    <circle cx="1180" cy="640" r="18" fill="#E8A25C" opacity="0.22"/>
    <circle cx="240" cy="700" r="26" fill="#6E3D25" opacity="0.28"/>
    <circle cx="620" cy="820" r="20" fill="#8A5A2E" opacity="0.20"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
